services:
  wireloft:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      secrets:
        - npmrc
    container_name: wireloft
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # App config, SQLite database, session/keyring secrets. Auto-created
      # and auto-migrated on the first start -- no manual setup needed.
      - ./config:/config
      # Downloaded shows/podcasts.
      - ./downloads:/downloads
    environment:
      - TZ=Europe/Amsterdam
      # Uncomment to require a login (leave unset for open/no-auth access):
      # - WL_ADMIN_AUTH__PASSWORD=change-me

secrets:
  # Font Awesome Pro registry token for the UI build (see .docker/Dockerfile).
  # Never committed -- create ui/.npmrc yourself with your own credentials.
  npmrc:
    file: ./ui/.npmrc
