<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline | WireLoft</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; padding: 24px; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #e2e8f0; background: #0b1220; }
      main { width: min(100%, 360px); text-align: center; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { color: #cbd5e1; line-height: 1.5; margin: 0 0 24px; }
      a { display: inline-block; padding: 12px 20px; border-radius: 8px; color: white; background: #2563eb; text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>WireLoft is offline</h1>
      <p>Reconnect to your WireLoft server to manage downloads, browse your library, and see current status.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
