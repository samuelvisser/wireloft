[project]
name = "wireloft-scheduler"
version = "0.1.0"
description = "Internal APScheduler-based task scheduler for WireLoft"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
  "APScheduler>=3.11.0",
  "SQLAlchemy>=2.0.43",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
