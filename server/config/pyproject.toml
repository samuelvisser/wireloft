[project]
name = "config"
version = "0.1.0"
description = "Central configuration package for WireLoft"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.11.7",
  "pydantic-settings>=2.6.1",
  "pyyaml>=6.0.2",
  "dailywire-api",
]

[project.scripts]
wireloft-config = "wireloft_config.__main__:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
