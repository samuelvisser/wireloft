[project]
name = "backend"
version = "0.4.1"
description = "WireLoft FastAPI backend API and DB utilities"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "SQLAlchemy>=2.0.43",
    "alembic>=1.19,<1.20",
    "fastapi>=0.118.0",
    "pydantic>=2.11.9",
    "pydantic-core>=2.33,<3",
    "pyyaml>=6.0.2",
    "uvicorn>=0.37.0",
    "cryptography>=43.0.1",
    "apprise==2.0.1",
    "psutil>=6.1.1",
    "config",
    "dailywire-api",
    "dailywire-authorisation",
    "dailywire-downloader",
    "task-manager",
    "controller",
    "jinja2>=3.1,<4",
]

[project.scripts]
backend-api = "backend.__main__:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
