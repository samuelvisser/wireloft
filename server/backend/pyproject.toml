[project]
name = "backend"
version = "0.1.0"
description = "WireLoft Flask backend API and DB utilities"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
  "Flask>=3.0",
  "Flask-Cors>=4.0",
  "SQLAlchemy>=2.0.43",
  "pydantic>=2.6",
]

[project.scripts]
backend-api = "backend.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
