[project]
name = "backend"
version = "0.1.0"
description = "WireLoft FastAPI backend API and DB utilities"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
  "SQLAlchemy>=2.0.43",
  "fastapi>=0.116.1",
  "pydantic>=2.6",
  "uvicorn>=0.30",
]

[project.scripts]
backend-api = "backend.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
