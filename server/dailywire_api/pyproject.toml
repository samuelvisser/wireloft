[project]
name = "dailywire-api"
version = "0.1.0"
description = "DailyWire API client and CLI"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.11.7",
]

[project.scripts]
dailywire-api = "dailywire_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
