[project]
name = "dailywire-api"
version = "0.1.0"
description = "DailyWire API client and CLI"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.11.7",
  "config",
  "dailywire-authorisation",
]

[project.scripts]
dailywire-api = "dailywire_api.__main__:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"