name: Custom index design audit
on:
  push:
    branches: [codex/custom-indexing-values]
permissions:
  contents: read
concurrency:
  group: codex-custom-index-audit
  cancel-in-progress: true
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
          npm ci --prefix ui
      - name: Export dependency workspace
        run: |
          mkdir -p audit
          tar -czf audit/python-dependencies.tar.gz -C .venv/lib/python3.13/site-packages .
          tar -czf audit/ui-dependencies.tar.gz -C ui node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: index-audit-dependencies
          path: audit/*.tar.gz
          retention-days: 1
