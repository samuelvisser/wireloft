name: Temporary Font Awesome lock migration

on:
  push:
    branches:
      - codex/font-awesome-icon-fallbacks

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/font-awesome-icon-fallbacks

      - name: Update package lock metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'ui/package-lock.json'
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'))
          const root = lock.packages['']

          delete root.dependencies['@awesome.me/kit-83fa1ac5a9']
          root.dependencies['@fortawesome/free-solid-svg-icons'] = '^7.0.0'
          root.optionalDependencies = {
            ...(root.optionalDependencies || {}),
            '@awesome.me/kit-83fa1ac5a9': '^1.0.4',
          }

          const kitPath = 'node_modules/@awesome.me/kit-83fa1ac5a9'
          if (!lock.packages[kitPath]) throw new Error(`Missing ${kitPath} from lockfile`)
          lock.packages[kitPath].optional = true

          const common62Path = 'node_modules/@fortawesome/fontawesome-common-types'
          if (lock.packages[common62Path]?.version === '6.7.2') {
            lock.packages[common62Path].optional = true
          }

          for (const [packagePath, metadata] of Object.entries(lock.packages)) {
            if (
              packagePath.startsWith('node_modules/@fortawesome/') &&
              typeof metadata.resolved === 'string' &&
              metadata.resolved.startsWith('https://npm.fontawesome.com/@fortawesome/')
            ) {
              metadata.resolved = metadata.resolved.replace(
                'https://npm.fontawesome.com',
                'https://registry.npmjs.org',
              )
            }
          }

          lock.packages['node_modules/@fortawesome/free-solid-svg-icons'] = {
            version: '7.0.0',
            resolved: 'https://registry.npmjs.org/@fortawesome/free-solid-svg-icons/-/free-solid-svg-icons-7.0.0.tgz',
            integrity: 'sha512-njSLAllkOddYDCXgTFboXn54Oe5FcvpkWq+FoetOHR64PbN0608kM02Lze0xtISGpXgP+i26VyXRQA0Irh3Obw==',
            license: '(CC-BY-4.0 AND MIT)',
            dependencies: {
              '@fortawesome/fontawesome-common-types': '7.0.0',
            },
            engines: {
              node: '>=6',
            },
          }

          lock.packages['node_modules/@fortawesome/free-solid-svg-icons/node_modules/@fortawesome/fontawesome-common-types'] = {
            version: '7.0.0',
            resolved: 'https://registry.npmjs.org/@fortawesome/fontawesome-common-types/-/fontawesome-common-types-7.0.0.tgz',
            integrity: 'sha512-PGMrIYXLGA5K8RWy8zwBkd4vFi4z7ubxtet6Yn13Plf6krRTwPbdlCwlcfmoX0R7B4Z643QvrtHmdQ5fNtfFCg==',
            license: 'MIT',
            engines: {
              node: '>=6',
            },
          }

          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`)
          NODE

      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update frontend dependency lockfile"
          git push origin HEAD:codex/font-awesome-icon-fallbacks
