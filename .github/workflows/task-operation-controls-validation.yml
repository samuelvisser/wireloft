name: Task operation controls validation

on:
  pull_request:
    branches: [develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync
      - name: Test durable cancel
        if: always()
        run: uv run pytest tests/unit/test_task_operation_controls.py::test_cancel_operation_is_durable_and_requests_running_worker_stop
      - name: Test shared-run cancel
        if: always()
        run: uv run pytest tests/unit/test_task_operation_controls.py::test_cancel_operation_does_not_stop_run_shared_with_another_active_operation
      - name: Test restart progress
        if: always()
        run: uv run pytest tests/unit/test_task_operation_controls.py::test_restart_operation_reports_restarted_progress
      - name: Test restart dispatch
        if: always()
        run: uv run pytest tests/unit/test_task_operation_controls.py::test_restart_operation_cancels_old_and_dispatches_unfinished
      - name: Test restart links
        if: always()
        run: uv run pytest tests/unit/test_task_operation_controls.py::test_restart_operation_replaces_unfinished_link
      - name: Test canceled retry executor
        if: always()
        run: uv run pytest tests/unit/test_task_operation_controls.py::test_executor_skips_retry_run_after_cancellation_request
      - name: Test task operations
        if: always()
        run: uv run pytest tests/unit/test_task_operations.py
      - name: Test task result execution
        if: always()
        run: uv run pytest tests/unit/test_task_result_execution.py
      - name: Test operation recovery
        if: always()
        run: uv run pytest tests/unit/test_task_operation_recovery.py
      - name: Test task execution
        if: always()
        run: uv run pytest tests/unit/test_task_execution.py
      - name: Test metadata operations
        if: always()
        run: uv run pytest tests/unit/test_episode_metadata_finalization.py
      - name: Verify Alembic history
        if: always()
        run: uv run backend-api db history

  frontend-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse changed TypeScript files
        run: |
          npx --yes esbuild@0.24.2 ui/src/components/ActionMenu/ActionMenu.tsx --loader:.tsx=tsx --format=esm --outfile=/tmp/action-menu.js
          npx --yes esbuild@0.24.2 ui/src/pages/show/ShowPage.tsx --loader:.tsx=tsx --format=esm --outfile=/tmp/show-page.js
          npx --yes esbuild@0.24.2 ui/src/lib/operations.ts --loader:.ts=ts --format=esm --outfile=/tmp/operations.js
