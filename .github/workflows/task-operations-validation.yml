name: Task operations validation

on:
  pull_request:
    branches:
      - develop

jobs:
  unit-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest tests/unit

  unit-develop-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest tests/unit

  focused-operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run operation-specific tests
        run: >-
          uv run pytest
          tests/unit/test_task_operations.py
          tests/unit/test_task_result_execution.py
          tests/unit/test_task_operation_recovery.py
          tests/unit/test_event_dispatch.py
          tests/unit/test_episode_metadata_finalization.py
          tests/unit/test_task_execution.py

  alembic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run backend db history

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci --registry=https://registry.npmjs.org
      - run: npm run build
