name: Task operations validation

on:
  pull_request:
    branches:
      - develop

jobs:
  unit-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest tests/unit

  unit-develop-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest tests/unit

  focused-operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: TaskOperation aggregation
        run: uv run pytest tests/unit/test_task_operations.py
      - name: TaskResult persistence
        run: uv run pytest tests/unit/test_task_result_execution.py
      - name: Operation restart recovery
        run: uv run pytest tests/unit/test_task_operation_recovery.py
      - name: Event operation propagation
        run: uv run pytest tests/unit/test_event_dispatch.py
      - name: Metadata operation integration
        run: uv run pytest tests/unit/test_episode_metadata_finalization.py
      - name: Executor integration
        run: uv run pytest tests/unit/test_task_execution.py

  alembic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run backend-api db history

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Remove unavailable paid optional icon package from validation checkout
        run: >-
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('ui/package.json')); delete p.optionalDependencies; fs.writeFileSync('ui/package.json', JSON.stringify(p,null,2)+'\\n'); const l=JSON.parse(fs.readFileSync('ui/package-lock.json')); delete l.packages[''].optionalDependencies; delete l.packages['node_modules/@awesome.me/kit-83fa1ac5a9']; fs.writeFileSync('ui/package-lock.json', JSON.stringify(l,null,2)+'\\n');"
      - run: npm --prefix ui ci --registry=https://registry.npmjs.org
      - run: npm run build
