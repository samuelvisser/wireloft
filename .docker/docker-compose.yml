# Run WireLoft from the published image -- no local build/clone needed.
#
# Usage:
#   mkdir wireloft && cd wireloft
#   curl -O https://raw.githubusercontent.com/samuelvisser/wireloft/develop/.docker/docker-compose.yml
#   docker compose up -d
# Then open http://localhost:8080.
#
# Building from source instead? Use the docker-compose.yml at the repo root.
services:
  wireloft:
    image: ghcr.io/samuelvisser/wireloft:latest
    container_name: wireloft
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # App config, SQLite database, session/keyring secrets. Auto-created
      # and auto-migrated on the first start -- no manual setup needed.
      - ./config:/config
      # Downloaded shows/podcasts.
      - ./downloads:/downloads
    environment:
      - TZ=UTC
      # Uncomment to require a login (leave unset for open/no-auth access):
      # - WL_ADMIN_AUTH__PASSWORD=change-me
