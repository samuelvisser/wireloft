# Preserve the public scheme supplied by an outer reverse proxy. When WireLoft
# is reached directly, fall back to this nginx instance's own scheme.
map $http_x_forwarded_proto $wireloft_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large request bodies (e.g. show/episode payloads) without nginx
    # rejecting them before they ever reach the backend.
    client_max_body_size 0;

    # Compress text responses from both the static frontend and proxied API/RSS
    # endpoints. This is intentionally limited to formats that compress well.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        application/javascript
        application/json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Protected backend routes live under /api (see backend.app:create_app).
    # Proxy the request through unchanged so FastAPI's own routing applies.
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $wireloft_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # RSS feeds and their media enclosures are intentionally public. Their
    # unguessable per-profile token is the authorization, so these requests
    # must reach FastAPI without being handled by the authenticated React app.
    location /feeds/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $wireloft_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite content-hashes production assets, so they can be cached indefinitely:
    # a changed asset always has a different URL.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The SPA shell and runtime config must remain revalidatable because their
    # stable URLs select the current hashed assets and deployment settings.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /config.json {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    # Always check the service worker and manifest after deployments.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
    }

    location = /offline.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Single-page app: let React Router handle any path that isn't a real
    # static asset.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
