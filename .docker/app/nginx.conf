server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large request bodies (e.g. show/episode payloads) without nginx
    # rejecting them before they ever reach the backend.
    client_max_body_size 0;

    # Protected backend routes live under /api (see backend.app:create_app).
    # Proxy the request through unchanged so FastAPI's own routing applies.
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # RSS feeds and their media enclosures are intentionally public. Their
    # unguessable per-profile token is the authorization, so these requests
    # must reach FastAPI without being handled by the authenticated React app.
    location /feeds/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Single-page app: let React Router handle any path that isn't a real
    # static asset.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
